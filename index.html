<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjana Lembaran Kerja Prasekolah</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel Standalone (Membolehkan React berjalan terus di GitHub Pages) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Font Jawi/Arab -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        .font-arabic { font-family: 'Amiri', serif; line-height: 1.5; }
        
        /* Tetapan khusus untuk mesin pencetak (Print) */
        @media print {
            body { background-color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            @page { size: A4 portrait; margin: 0; }
            .a4-page { box-shadow: none !important; border: none !important; margin: 0 !important; width: 100% !important; border-radius: 0 !important; padding: 15mm !important; }
        }
    </style>
</head>
<body class="bg-emerald-50 text-gray-900 pb-10 min-h-screen font-sans">

    <!-- Container Utama React -->
    <div id="root"></div>

    <!-- Kod Logik React -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- PANGKALAN DATA (DATABASE) ---
        const dbGeneral = [
            { emoji: '🍎', bm: 'Epal', eng: 'Apple', jawi: 'ايڤل' },
            { emoji: '🚗', bm: 'Kereta', eng: 'Car', jawi: 'کريتا' },
            { emoji: '🐈', bm: 'Kucing', eng: 'Cat', jawi: 'کوچيڠ' },
            { emoji: '👕', bm: 'Baju', eng: 'Shirt', jawi: 'باجو' },
            { emoji: '📖', bm: 'Buku', eng: 'Book', jawi: 'بوکو' },
            { emoji: '🐟', bm: 'Ikan', eng: 'Fish', jawi: 'ايکن' },
            { emoji: '🌺', bm: 'Bunga', eng: 'Flower', jawi: 'بوڠا' },
            { emoji: '☀️', bm: 'Matahari', eng: 'Sun', jawi: 'ماتاهاري' },
            { emoji: '🍃', bm: 'Daun', eng: 'Leaf', jawi: 'داون' },
            { emoji: '☔', bm: 'Payung', eng: 'Umbrella', jawi: 'ڤايوڠ' },
            { emoji: '🦅', bm: 'Burung', eng: 'Bird', jawi: 'بوروڠ' },
            { emoji: '🥕', bm: 'Lobak', eng: 'Carrot', jawi: 'لوبق' },
            { emoji: '✏️', bm: 'Pensel', eng: 'Pencil', jawi: 'ڤينسيل' },
            { emoji: '⭐', bm: 'Bintang', eng: 'Star', jawi: 'بينتڠ' },
        ];

        const dbArab = {
            nombor: [{ emoji: '1️⃣', arab: 'وَاحِد' }, { emoji: '2️⃣', arab: 'اِثْنَان' }, { emoji: '3️⃣', arab: 'ثَلَاثَة' }, { emoji: '4️⃣', arab: 'أَرْبَعَة' }, { emoji: '5️⃣', arab: 'خَمْسَة' }, { emoji: '6️⃣', arab: 'سِتَّة' }, { emoji: '7️⃣', arab: 'سَبْعَة' }, { emoji: '8️⃣', arab: 'ثَمَانِيَة' }, { emoji: '9️⃣', arab: 'تِسْعَة' }, { emoji: '🔟', arab: 'عَشَرَة' }],
            keluarga: [{ emoji: '👨', arab: 'أَب' }, { emoji: '👩', arab: 'أُم' }, { emoji: '👦', arab: 'أَخ' }, { emoji: '👧', arab: 'أُخْت' }, { emoji: '👴', arab: 'جَدّ' }, { emoji: '👵', arab: 'جَدَّة' }],
            badan: [{ emoji: '👁️', arab: 'عَيْن' }, { emoji: '👂', arab: 'أُذُن' }, { emoji: '👃', arab: 'أَنْف' }, { emoji: '👄', arab: 'فَم' }, { emoji: '✋', arab: 'يَد' }, { emoji: '🦶', arab: 'رِجْل' }],
            sekolah: [{ emoji: '📖', arab: 'كِتَاب' }, { emoji: '🖊️', arab: 'قَلَم' }, { emoji: '🎒', arab: 'حَقِيبَة' }, { emoji: '📏', arab: 'مِسْطَرَة' }, { emoji: '📝', arab: 'وَرَقَة' }, { emoji: '✂️', arab: 'مِقَصّ' }],
            warna: [{ emoji: '🔴', arab: 'أَحْمَر' }, { emoji: '🔵', arab: 'أَزْرَق' }, { emoji: '🟢', arab: 'أَخْضَر' }, { emoji: '🟡', arab: 'أَصْفَر' }, { emoji: '⚫', arab: 'أَسْوَد' }, { emoji: '⚪', arab: 'أَبْيَض' }]
        };

        const dbSains = {
            hidup: [{ emoji: '🐈', sains: 'Benda Hidup' }, { emoji: '🌳', sains: 'Benda Hidup' }, { emoji: '👦', sains: 'Benda Hidup' }, { emoji: '🦅', sains: 'Benda Hidup' }, { emoji: '🪨', sains: 'Bukan Hidup' }, { emoji: '🚗', sains: 'Bukan Hidup' }, { emoji: '📖', sains: 'Bukan Hidup' }, { emoji: '🧸', sains: 'Bukan Hidup' }],
            bahagian: [{ emoji: '🍃', sains: 'Daun' }, { emoji: '🌺', sains: 'Bunga' }, { emoji: '🌳', sains: 'Batang' }, { emoji: '🦅', sains: 'Sayap' }, { emoji: '🐈', sains: 'Ekor' }, { emoji: '🐠', sains: 'Sirip' }, { emoji: '🐘', sains: 'Gading' }, { emoji: '🦆', sains: 'Paruh' }],
            serapan: [{ emoji: '🧽', sains: 'Menyerap Air' }, { emoji: '👕', sains: 'Menyerap Air' }, { emoji: '🧻', sains: 'Menyerap Air' }, { emoji: '🧦', sains: 'Menyerap Air' }, { emoji: '☔', sains: 'Kalis Air' }, { emoji: '🛍️', sains: 'Kalis Air' }, { emoji: '👢', sains: 'Kalis Air' }, { emoji: '🧤', sains: 'Kalis Air' }],
            makanan: [{ emoji: '🍎', sains: 'Makanan Sihat' }, { emoji: '🥦', sains: 'Makanan Sihat' }, { emoji: '🥛', sains: 'Makanan Sihat' }, { emoji: '🥕', sains: 'Makanan Sihat' }, { emoji: '🍬', sains: 'Tidak Sihat' }, { emoji: '🍩', sains: 'Tidak Sihat' }, { emoji: '🍟', sains: 'Tidak Sihat' }, { emoji: '🥤', sains: 'Tidak Sihat' }]
        };

        const subjects = [
            { id: 'bm', name: 'Bahasa Melayu' }, { id: 'eng', name: 'Bahasa Inggeris' }, { id: 'jawi', name: 'Jawi' }, { id: 'math', name: 'Matematik' },
            { id: 'arab', name: 'Bahasa Arab', subtopics: ['nombor', 'keluarga', 'badan', 'sekolah', 'warna'] },
            { id: 'sains', name: 'Sains', subtopics: ['hidup', 'bahagian', 'serapan', 'makanan'] },
        ];

        const subtopicLabels = {
            nombor: 'Nombor 1-10', keluarga: 'Keluarga', badan: 'Anggota Badan', sekolah: 'Peralatan', warna: 'Warna',
            hidup: 'Benda Hidup/Bukan', bahagian: 'Bahagian Tubuh', serapan: 'Serapan Air', makanan: 'Makanan Sihat/Tidak'
        };

        const getInstruction = (subjectId, pattern) => {
            const instructions = {
                pilih: { bm: 'Tandakan (✓) pada jawapan yang betul.', eng: 'Tick (✓) the correct answer.', jawi: 'تنداكن (✓) ڤد جواڤن يڠ بتول.', math: 'Kira dan tandakan (✓) jawapan yang betul.', arab: 'ضَعْ عَلَامَة (✓) عَلَى الإِجَابَةِ الصَّحِيحَةِ.', sains: 'Tandakan (✓) pada kategori yang betul.' },
                suaikan: { bm: 'Suaikan gambar dengan padanan yang betul.', eng: 'Match the pictures correctly.', jawi: 'سوايکن ݢمبر دڠن ڤادنن يڠ بتول.', math: 'Kira dan suaikan dengan nombor yang betul.', arab: 'صِلِ الصُّورَةَ بِالكَلِمَةِ المُنَاسِبَةِ.', sains: 'Suaikan gambar dengan fakta yang betul.' },
                tulis: { bm: 'Namakan gambar di bawah.', eng: 'Write the correct word for each picture.', jawi: 'توليسکن نام ݢمبر دباوه.', math: 'Kira dan tuliskan nombor yang betul.', arab: 'اُكْتُبِ الكَلِمَةَ المُنَاسِبَةَ لِكُلِّ صُورَةٍ.', sains: 'Tuliskan ciri/kategori yang betul.' },
                tambah: { math: 'Selesaikan operasi tambah di bawah.' }, tolak: { math: 'Selesaikan operasi tolak di bawah.' }
            };
            return instructions[pattern]?.[subjectId] || 'Sila jawab soalan di bawah.';
        };

        // --- KOMPONEN UTAMA ---
        function App() {
            const [activeSubject, setActiveSubject] = useState('bm');
            const [activeSubtopic, setActiveSubtopic] = useState('');
            const [activePattern, setActivePattern] = useState('pilih');
            const [worksheetData, setWorksheetData] = useState({ type: 'pilih', items: [] });

            const shuffleArray = (array) => [...array].sort(() => Math.random() - 0.5);
            const getRandomItem = (arr) => arr[Math.floor(Math.random() * arr.length)];

            const handleSubjectChange = (subjectId) => {
                let nextSubtopic = '';
                if (subjectId === 'arab') nextSubtopic = 'nombor';
                else if (subjectId === 'sains') nextSubtopic = 'hidup';
                
                let nextPattern = activePattern;
                if (subjectId !== 'math' && (activePattern === 'tambah' || activePattern === 'tolak')) {
                    nextPattern = 'pilih';
                }
                setActiveSubject(subjectId);
                setActiveSubtopic(nextSubtopic);
                setActivePattern(nextPattern);
            };

            useEffect(() => {
                generateWorksheet();
            }, [activeSubject, activeSubtopic, activePattern]);

            const generateWorksheet = () => {
                const isMath = activeSubject === 'math';
                let sourceDb = dbGeneral;
                let targetLang = activeSubject;

                if (activeSubject === 'arab') sourceDb = dbArab[activeSubtopic || 'nombor'];
                else if (activeSubject === 'sains') sourceDb = dbSains[activeSubtopic || 'hidup'];

                if (activePattern === 'pilih') {
                    const numQs = 6;
                    let uniqueItems = [...new Map(sourceDb.map(item => [item.emoji, item])).values()];
                    let selectedItems = shuffleArray(uniqueItems).slice(0, numQs);
                    
                    while (selectedItems.length < numQs && sourceDb.length > 0) {
                        selectedItems.push(getRandomItem(sourceDb));
                    }

                    let questions = selectedItems.map(item => {
                        let count = isMath ? Math.floor(Math.random() * 8) + 2 : 1;
                        let correctAnswer = isMath ? count.toString() : (item[targetLang] || '');
                        let wrongAnswer = '';

                        if (isMath) {
                            let wrongNum = count + (Math.random() > 0.5 ? 1 : -1);
                            if (wrongNum < 1) wrongNum = count + 2;
                            wrongAnswer = wrongNum.toString();
                        } else {
                            let optionsAvailable = [...new Set(sourceDb.map(i => i[targetLang]))];
                            if (activeSubject === 'sains' && optionsAvailable.length === 2) {
                                wrongAnswer = optionsAvailable.find(opt => opt !== correctAnswer) || '';
                            } else {
                                let wrongItem = getRandomItem(sourceDb);
                                let attempts = 0;
                                while (wrongItem[targetLang] === correctAnswer && attempts < 10) {
                                    wrongItem = getRandomItem(sourceDb);
                                    attempts++;
                                }
                                wrongAnswer = wrongItem[targetLang] || '';
                            }
                        }
                        return { emoji: item.emoji, count, options: shuffleArray([correctAnswer, wrongAnswer]) };
                    });
                    setWorksheetData({ type: 'pilih', items: questions });
                } 
                
                else if (activePattern === 'suaikan') {
                    const numQs = 5;
                    let uniqueItems = isMath ? sourceDb : [...new Map(sourceDb.map(item => [item[targetLang], item])).values()];
                    let selected = shuffleArray(uniqueItems).slice(0, numQs);
                    
                    let leftCol = selected.map(item => ({
                        emoji: item.emoji, count: isMath ? Math.floor(Math.random() * 8) + 2 : 1, originalId: item.emoji, answerText: item[targetLang] || ''
                    }));

                    let rightCol = shuffleArray(leftCol.map(l => ({
                        id: l.originalId, text: isMath ? l.count.toString() : l.answerText
                    })));
                    setWorksheetData({ type: 'suaikan', leftItems: leftCol, rightItems: rightCol });
                }
                
                else if (activePattern === 'tulis') {
                    const numQs = 6;
                    let uniqueItems = isMath ? sourceDb : [...new Map(sourceDb.map(item => [item[targetLang], item])).values()];
                    let selected = shuffleArray(uniqueItems).slice(0, numQs);
                    setWorksheetData({ type: 'tulis', items: selected.map(i => ({ emoji: i.emoji, count: isMath ? Math.floor(Math.random() * 8) + 2 : 1 })) });
                }
                
                else if (activePattern === 'tambah') {
                    let qs = [];
                    for(let i=0; i<5; i++) qs.push({ emoji: getRandomItem(dbGeneral).emoji, c1: Math.floor(Math.random() * 5) + 1, c2: Math.floor(Math.random() * 5) + 1 });
                    setWorksheetData({ type: 'tambah', items: qs });
                }

                else if (activePattern === 'tolak') {
                    let qs = [];
                    for(let i=0; i<5; i++) {
                        let total = Math.floor(Math.random() * 6) + 3; 
                        let sub = Math.floor(Math.random() * (total - 1)) + 1;
                        qs.push({ emoji: getRandomItem(dbGeneral).emoji, c1: total, c2: sub });
                    }
                    setWorksheetData({ type: 'tolak', items: qs });
                }
            };

            const currentSubject = subjects.find(s => s.id === activeSubject);
            const isRTL = activeSubject === 'jawi' || activeSubject === 'arab';

            return (
                <div className="w-full flex flex-col items-center">
                    
                    {/* PANEL KAWALAN (Sembunyi semasa cetak) */}
                    <div className="no-print bg-white shadow-xl p-6 mb-8 w-full max-w-5xl rounded-b-2xl border-t-8 border-emerald-500">
                        <h1 className="text-3xl font-extrabold text-center mb-6 text-emerald-600">
                            ✅ Penjana Lembaran Pra
                        </h1>
                        
                        {/* 1. Subjek */}
                        <div className="mb-5">
                            <p className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 text-center">1. Pilih Subjek</p>
                            <div className="flex flex-wrap justify-center gap-2">
                                {subjects.map((sub) => (
                                    <button key={sub.id} onClick={() => handleSubjectChange(sub.id)}
                                        className={`px-5 py-2.5 rounded-xl font-bold text-sm transition-all ${
                                            activeSubject === sub.id ? 'bg-emerald-500 text-white shadow-md transform scale-105' : 'bg-gray-100 hover:bg-gray-200 text-gray-600'
                                        }`}>
                                        {sub.name}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 2. Topik Khusus (Arab/Sains) */}
                        {currentSubject?.subtopics && (
                            <div className="mb-5 bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                                <p className="text-xs font-bold text-emerald-600 uppercase tracking-widest mb-3 text-center">
                                    📖 Topik Khusus {currentSubject.name}
                                </p>
                                <div className="flex flex-wrap justify-center gap-2">
                                    {currentSubject.subtopics.map((st) => (
                                        <button key={st} onClick={() => setActiveSubtopic(st)}
                                            className={`px-4 py-1.5 rounded-full font-semibold text-sm transition-all ${
                                                activeSubtopic === st ? 'bg-amber-400 text-amber-900 shadow-sm' : 'bg-white border border-gray-200 text-gray-600 hover:bg-gray-50'
                                            }`}>
                                            {subtopicLabels[st]}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 3. Corak Soalan */}
                        <div className="mb-6 border-t pt-5">
                            <p className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 text-center">2. Pilih Corak Soalan</p>
                            <div className="flex flex-wrap justify-center gap-3">
                                <button onClick={() => setActivePattern('pilih')} className={`px-4 py-2 rounded-full border-2 font-bold ${activePattern === 'pilih' ? 'border-emerald-500 bg-emerald-50 text-emerald-700' : 'border-gray-200 text-gray-500 hover:bg-gray-50'}`}>Tandakan ✓</button>
                                <button onClick={() => setActivePattern('suaikan')} className={`px-4 py-2 rounded-full border-2 font-bold ${activePattern === 'suaikan' ? 'border-emerald-500 bg-emerald-50 text-emerald-700' : 'border-gray-200 text-gray-500 hover:bg-gray-50'}`}>Suaikan Garis</button>
                                <button onClick={() => setActivePattern('tulis')} className={`px-4 py-2 rounded-full border-2 font-bold ${activePattern === 'tulis' ? 'border-emerald-500 bg-emerald-50 text-emerald-700' : 'border-gray-200 text-gray-500 hover:bg-gray-50'}`}>Tulis Jawapan</button>
                                
                                {activeSubject === 'math' && (
                                    <>
                                        <button onClick={() => setActivePattern('tambah')} className={`px-4 py-2 rounded-full border-2 font-bold ${activePattern === 'tambah' ? 'border-amber-500 bg-amber-50 text-amber-700' : 'border-gray-200 text-gray-500 hover:bg-gray-50'}`}>Operasi Tambah (+)</button>
                                        <button onClick={() => setActivePattern('tolak')} className={`px-4 py-2 rounded-full border-2 font-bold ${activePattern === 'tolak' ? 'border-rose-500 bg-rose-50 text-rose-700' : 'border-gray-200 text-gray-500 hover:bg-gray-50'}`}>Operasi Tolak (-)</button>
                                    </>
                                )}
                            </div>
                        </div>

                        {/* Actions */}
                        <div className="flex justify-center gap-4 border-t pt-6 bg-gray-50 -mx-6 -mb-6 p-6 rounded-b-xl">
                            <button onClick={generateWorksheet} className="flex items-center gap-2 px-6 py-3 bg-teal-500 hover:bg-teal-600 text-white font-bold rounded-xl shadow-md transition-transform hover:scale-105">
                                🔄 Jana Semula
                            </button>
                            <button onClick={() => window.print()} className="flex items-center gap-2 px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-transform hover:scale-105">
                                🖨️ Cetak (Saiz A4)
                            </button>
                        </div>
                    </div>

                    {/* KERTAS A4 UNTUK DICETAK */}
                    <div className="a4-page max-w-[210mm] min-h-[297mm] bg-white shadow-2xl p-[15mm] border border-gray-200 relative overflow-hidden rounded-md">
                        
                        {/* Hiasan Bucu */}
                        <div className="absolute top-0 left-0 w-full h-4 bg-gradient-to-r from-emerald-400 via-amber-300 to-sky-400 opacity-90"></div>
                        <div className="absolute top-4 left-4 text-3xl opacity-20">✏️</div>
                        <div className="absolute top-10 right-10 text-3xl opacity-20">🎨</div>

                        {/* Nama / Tarikh */}
                        <div className="flex justify-between items-end border-b-2 border-dashed border-gray-400 pb-2 mb-6 text-lg font-bold mt-4">
                            <div className="flex gap-2 w-7/12 items-end">
                                <span className="text-gray-800">Nama:</span>
                                <div className="border-b-2 border-gray-700 flex-1"></div>
                            </div>
                            <div className="flex gap-2 w-4/12 items-end">
                                <span className="text-gray-800">Tarikh:</span>
                                <div className="border-b-2 border-gray-700 flex-1"></div>
                            </div>
                        </div>

                        {/* Tajuk Soalan */}
                        <div className="text-center mb-8 bg-emerald-50 py-3 rounded-2xl border-2 border-emerald-100">
                            <h2 className="text-4xl font-extrabold tracking-wide mb-2 text-emerald-700 uppercase">
                                {currentSubject.name} {activeSubtopic ? `- ${subtopicLabels[activeSubtopic]}` : ''}
                            </h2>
                            <p className={`text-xl font-bold text-gray-700 ${isRTL ? 'font-arabic text-2xl' : ''}`} dir={isRTL ? "rtl" : "ltr"}>
                                {getInstruction(activeSubject, activePattern)}
                            </p>
                        </div>

                        {/* RENDERER SOALAN */}
                        {worksheetData.type === 'pilih' && (
                            <div className="grid grid-cols-2 gap-x-6 gap-y-7 px-2">
                                {worksheetData.items.map((q, idx) => (
                                    <div key={idx} className="flex flex-col border-4 border-gray-100 rounded-2xl overflow-hidden shadow-sm">
                                        <div className="h-32 bg-white flex flex-wrap justify-center items-center gap-1 p-2 border-b-4 border-gray-100">
                                            {Array.from({ length: q.count }).map((_, i) => (
                                                <span key={i} className={q.count > 4 ? "text-4xl" : "text-5xl"} style={{ filter: 'drop-shadow(2px 2px 4px rgba(0,0,0,0.1))' }}>{q.emoji}</span>
                                            ))}
                                        </div>
                                        {q.options.map((opt, i) => (
                                            <div key={i} className={`flex h-12 bg-gray-50 ${i === 0 ? 'border-b-2 border-gray-200' : ''}`}>
                                                <div className={`flex-1 flex items-center px-4 text-2xl font-bold text-gray-800 ${isRTL ? 'justify-end font-arabic text-3xl' : 'justify-center'} ${activeSubject === 'sains' ? 'text-xl' : ''}`} dir={isRTL ? "rtl" : "ltr"}>{opt}</div>
                                                <div className="w-14 border-l-4 border-white flex justify-center items-center bg-gray-100">
                                                    <div className="w-7 h-7 border-4 border-white rounded-md shadow-inner bg-white"></div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ))}
                            </div>
                        )}

                        {worksheetData.type === 'suaikan' && (
                            <div className="flex justify-between w-full mt-2 px-8 h-[700px]">
                                <div className="flex flex-col justify-between h-full w-[45%]">
                                    {worksheetData.leftItems.map((item, idx) => (
                                        <div key={idx} className="flex items-center gap-4">
                                            <div className="w-40 h-[100px] border-4 border-emerald-100 rounded-2xl flex flex-wrap justify-center items-center p-2 bg-white shadow-sm">
                                                {Array.from({ length: item.count }).map((_, i) => <span key={i} className={item.count > 4 ? "text-3xl" : "text-4xl"}>{item.emoji}</span>)}
                                            </div>
                                            <div className="w-4 h-4 rounded-full bg-emerald-400 shadow-md"></div>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex flex-col justify-between h-full w-[45%] items-end">
                                    {worksheetData.rightItems.map((item, idx) => (
                                        <div key={idx} className="flex items-center gap-4">
                                            <div className="w-4 h-4 rounded-full bg-amber-400 shadow-md"></div>
                                            <div className={`w-48 h-[100px] border-4 border-amber-100 rounded-2xl flex justify-center items-center text-2xl font-extrabold text-gray-800 p-4 text-center bg-white shadow-sm ${isRTL ? 'font-arabic text-3xl' : ''}`} dir={isRTL ? "rtl" : "ltr"}>{item.text}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {worksheetData.type === 'tulis' && (
                            <div className="flex flex-col gap-5 mt-2 px-4">
                                {worksheetData.items.map((item, idx) => (
                                    <div key={idx} className="flex items-center w-full gap-6">
                                        <div className="w-48 h-28 border-4 border-gray-200 rounded-2xl flex flex-wrap justify-center items-center p-3 shrink-0 bg-gray-50 shadow-sm">
                                            {Array.from({ length: item.count }).map((_, i) => <span key={i} className={item.count > 4 ? "text-3xl" : "text-4xl"}>{item.emoji}</span>)}
                                        </div>
                                        <div className="flex-1 flex items-end pb-3">
                                            {activeSubject === 'math' ? (
                                                <div className="w-24 h-24 border-4 border-gray-300 rounded-2xl ml-4 bg-white shadow-inner"></div>
                                            ) : (
                                                <div className="w-full h-16 border-b-4 border-dashed border-gray-400 ml-4 relative">
                                                    <div className="absolute bottom-4 w-full border-b border-gray-200"></div>
                                                    <div className="absolute bottom-8 w-full border-b border-dashed border-gray-300"></div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {(worksheetData.type === 'tambah' || worksheetData.type === 'tolak') && (
                            <div className="flex flex-col gap-8 mt-4 px-4">
                                {worksheetData.items.map((item, idx) => (
                                    <div key={idx} className="flex items-center justify-between w-full h-32 bg-gray-50 rounded-3xl p-4 border-2 border-white shadow-sm">
                                        <div className="flex flex-wrap justify-center items-center gap-1 w-32 bg-white h-full rounded-2xl border-2 border-gray-200 shadow-sm">
                                            {Array.from({ length: item.c1 }).map((_, i) => <span key={`a${i}`} className="text-3xl">{item.emoji}</span>)}
                                        </div>
                                        <div className={`text-6xl font-black ${worksheetData.type === 'tambah' ? 'text-amber-500' : 'text-rose-500'}`}>
                                            {worksheetData.type === 'tambah' ? '+' : '-'}
                                        </div>
                                        <div className="flex flex-wrap justify-center items-center gap-1 w-32 bg-white h-full rounded-2xl border-2 border-gray-200 shadow-sm">
                                            {Array.from({ length: item.c2 }).map((_, i) => <span key={`b${i}`} className="text-3xl">{item.emoji}</span>)}
                                        </div>
                                        <div className="text-5xl font-black text-gray-400">=</div>
                                        <div className="w-28 h-24 border-4 border-gray-300 bg-white rounded-2xl shadow-inner"></div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* Footer Print */}
                        <div className="absolute bottom-6 w-[calc(100%-30mm)] text-center text-gray-500 font-bold text-xl">
                            🌟 <span className="tracking-wide">SYABAS! TERUSKAN USAHA!</span> 🌟
                        </div>
                    </div>
                </div>
            );
        }

        // Render Aplikasi
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
