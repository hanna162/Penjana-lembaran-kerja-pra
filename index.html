<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penjana Lembaran Kerja Prasekolah V6 (Final QA)</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Font Jawi/Arab & Font Surih -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Mali:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        .font-arabic { font-family: 'Amiri', serif; line-height: 1.6; }
        .font-surih { font-family: 'Mali', cursive; color: #cbd5e1; letter-spacing: 4px; }
        
        /* Tetapan khusus cetakan A4 */
        @media print {
            body { background-color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; margin: 0; padding: 0; }
            .no-print { display: none !important; }
            @page { size: A4 portrait; margin: 0; }
            .a4-page { 
                box-shadow: none !important; border: none !important; margin: 0 !important; 
                width: 210mm !important; height: 297mm !important; 
                padding: 12mm 15mm !important; 
                page-break-after: avoid; page-break-inside: avoid;
            }
        }
    </style>
</head>
<body class="bg-emerald-50 text-gray-900 pb-10 min-h-screen font-sans">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // --- PANGKALAN DATA ---
        const dbGeneral = [
            { emoji: '🍎', bm: 'Epal', sk: ['e','pal'], eng: 'Apple', jawi: 'ايڤل' },
            { emoji: '🚗', bm: 'Kereta', sk: ['ke','re','ta'], eng: 'Car', jawi: 'کريتا' },
            { emoji: '🐈', bm: 'Kucing', sk: ['ku','cing'], eng: 'Cat', jawi: 'کوچيڠ' },
            { emoji: '👕', bm: 'Baju', sk: ['ba','ju'], eng: 'Shirt', jawi: 'باجو' },
            { emoji: '📖', bm: 'Buku', sk: ['bu','ku'], eng: 'Book', jawi: 'بوکو' },
            { emoji: '🐟', bm: 'Ikan', sk: ['i','kan'], eng: 'Fish', jawi: 'ايکن' },
            { emoji: '🌺', bm: 'Bunga', sk: ['bu','nga'], eng: 'Flower', jawi: 'بوڠا' },
            { emoji: '☀️', bm: 'Matahari', sk: ['ma','ta','ha','ri'], eng: 'Sun', jawi: 'ماتاهاري' },
            { emoji: '⚽', bm: 'Bola', sk: ['bo','la'], eng: 'Ball', jawi: 'بولا' },
            { emoji: '🚲', bm: 'Basikal', sk: ['ba','si','kal'], eng: 'Bicycle', jawi: 'باسيكل' },
            { emoji: '🏠', bm: 'Rumah', sk: ['ru','mah'], eng: 'House', jawi: 'رومه' },
            { emoji: '🥛', bm: 'Susu', sk: ['su','su'], eng: 'Milk', jawi: 'سوسو' },
            { emoji: '👟', bm: 'Kasut', sk: ['ka','sut'], eng: 'Shoes', jawi: 'كاسوت' },
            { emoji: '🪑', bm: 'Kerusi', sk: ['ke','ru','si'], eng: 'Chair', jawi: 'كروسي' },
            { emoji: '☔', bm: 'Payung', sk: ['pa','yung'], eng: 'Umbrella', jawi: 'ڤايوڠ' },
            { emoji: '🦅', bm: 'Burung', sk: ['bu','rung'], eng: 'Bird', jawi: 'بوروڠ' },
            { emoji: '🥕', bm: 'Lobak', sk: ['lo','bak'], eng: 'Carrot', jawi: 'لوبق' },
            { emoji: '✏️', bm: 'Pensel', sk: ['pen','sel'], eng: 'Pencil', jawi: 'ڤينسيل' }
        ];

        const dbArab = {
            nombor: [{ emoji: '1️⃣', arab: 'وَاحِد' }, { emoji: '2️⃣', arab: 'اِثْنَان' }, { emoji: '3️⃣', arab: 'ثَلَاثَة' }, { emoji: '4️⃣', arab: 'أَرْبَعَة' }, { emoji: '5️⃣', arab: 'خَمْسَة' }, { emoji: '6️⃣', arab: 'سِتَّة' }, { emoji: '7️⃣', arab: 'سَبْعَة' }, { emoji: '8️⃣', arab: 'ثَمَانِيَة' }, { emoji: '9️⃣', arab: 'تِسْعَة' }, { emoji: '🔟', arab: 'عَشَرَة' }],
            keluarga: [{ emoji: '👨', arab: 'أَب' }, { emoji: '👩', arab: 'أُم' }, { emoji: '👦', arab: 'أَخ' }, { emoji: '👧', arab: 'أُخْت' }, { emoji: '👴', arab: 'جَدّ' }, { emoji: '👵', arab: 'جَدَّة' }],
            badan: [{ emoji: '👁️', arab: 'عَيْن' }, { emoji: '👂', arab: 'أُذُن' }, { emoji: '👃', arab: 'أَنْف' }, { emoji: '👄', arab: 'فَم' }, { emoji: '✋', arab: 'يَد' }, { emoji: '🦶', arab: 'رِجْل' }],
            sekolah: [{ emoji: '📖', arab: 'كِتَاب' }, { emoji: '🖊️', arab: 'قَلَم' }, { emoji: '🎒', arab: 'حَقِيبَة' }, { emoji: '📏', arab: 'مِسْطَرَة' }, { emoji: '📝', arab: 'وَرَقَة' }, { emoji: '✂️', arab: 'مِقَصّ' }],
            warna: [{ emoji: '🔴', arab: 'أَحْمَر' }, { emoji: '🔵', arab: 'أَزْرَق' }, { emoji: '🟢', arab: 'أَخْضَر' }, { emoji: '🟡', arab: 'أَصْفَر' }, { emoji: '⚫', arab: 'أَسْوَد' }, { emoji: '⚪', arab: 'أَبْيَض' }]
        };

        const dbSains = {
            hidup: [{ emoji: '🐈', sains: 'Benda Hidup' }, { emoji: '🌳', sains: 'Benda Hidup' }, { emoji: '👦', sains: 'Benda Hidup' }, { emoji: '🦅', sains: 'Benda Hidup' }, { emoji: '🪨', sains: 'Bukan Hidup' }, { emoji: '🚗', sains: 'Bukan Hidup' }, { emoji: '📖', sains: 'Bukan Hidup' }, { emoji: '🧸', sains: 'Bukan Hidup' }],
            bahagian: [{ emoji: '🍃', sains: 'Daun' }, { emoji: '🌺', sains: 'Bunga' }, { emoji: '🌳', sains: 'Batang' }, { emoji: '🦅', sains: 'Sayap' }, { emoji: '🐈', sains: 'Ekor' }, { emoji: '🐠', sains: 'Sirip' }, { emoji: '🐘', sains: 'Gading' }, { emoji: '🦆', sains: 'Paruh' }],
            serapan: [{ emoji: '🧽', sains: 'Menyerap Air' }, { emoji: '👕', sains: 'Menyerap Air' }, { emoji: '🧻', sains: 'Menyerap Air' }, { emoji: '🧦', sains: 'Menyerap Air' }, { emoji: '☔', sains: 'Kalis Air' }, { emoji: '🛍️', sains: 'Kalis Air' }, { emoji: '👢', sains: 'Kalis Air' }, { emoji: '🧤', sains: 'Kalis Air' }],
            makanan: [{ emoji: '🍎', sains: 'Makanan Sihat' }, { emoji: '🥦', sains: 'Makanan Sihat' }, { emoji: '🥛', sains: 'Makanan Sihat' }, { emoji: '🥕', sains: 'Makanan Sihat' }, { emoji: '🍬', sains: 'Tidak Sihat' }, { emoji: '🍩', sains: 'Tidak Sihat' }, { emoji: '🍟', sains: 'Tidak Sihat' }, { emoji: '🥤', sains: 'Tidak Sihat' }]
        };

        const subjects = [
            { id: 'bm', name: 'Bahasa Melayu' }, { id: 'eng', name: 'Bahasa Inggeris' }, { id: 'jawi', name: 'Jawi' }, { id: 'math', name: 'Matematik' },
            { id: 'arab', name: 'Bahasa Arab', subtopics: ['nombor', 'keluarga', 'badan', 'sekolah', 'warna'] },
            { id: 'sains', name: 'Sains', subtopics: ['hidup', 'bahagian', 'serapan', 'makanan'] },
        ];

        const subtopicLabels = {
            nombor: 'Nombor 1-10', keluarga: 'Keluarga Saya', badan: 'Anggota Badan', sekolah: 'Peralatan Sekolah', warna: 'Warna',
            hidup: 'Hidup / Bukan Hidup', bahagian: 'Bahagian Tubuh', serapan: 'Serapan Air', makanan: 'Makanan Sihat & Tidak Sihat'
        };

        const getInstruction = (subjectId, pattern) => {
            const instructions = {
                pilih: { bm: 'Tandakan (✓) pada jawapan yang betul.', eng: 'Tick (✓) the correct answer.', jawi: 'تنداكن (✓) ڤد جواڤن يڠ بتول.', math: 'Kira dan tandakan (✓) jawapan yang betul.', arab: 'ضَعْ عَلَامَة (✓) عَلَى الإِجَابَةِ الصَّحِيحَةِ.', sains: 'Tandakan (✓) pada kategori yang betul.' },
                bulatkan: { bm: 'Bulatkan jawapan yang betul.', eng: 'Circle the correct answer.', jawi: 'بولتكن جواڤن يڠ بتول.', math: 'Kira dan bulatkan nombor yang betul.', arab: 'ضَعْ دَائِرَةً حَوْلَ الإِجَابَةِ الصَّحِيحَةِ.', sains: 'Bulatkan kategori yang betul.' },
                suaikan: { bm: 'Suaikan gambar dengan padanan yang betul.', eng: 'Match the pictures correctly.', jawi: 'سوايکن ݢمبر دڠن ڤادنن يڠ بتول.', math: 'Kira dan suaikan dengan nombor yang betul.', arab: 'صِلِ الصُّورَةَ بِالكَلِمَةِ المُنَاسِبَةِ.', sains: 'Suaikan gambar dengan fakta yang betul.' },
                tulis: { bm: 'Tuliskan nama gambar di bawah.', eng: 'Write the correct word for each picture.', jawi: 'توليسکن نام ݢمبر دباوه.', math: 'Kira dan tuliskan nombor yang betul.', arab: 'اُكْتُبِ الكَلِمَةَ المُنَاسِبَةَ لِكُلِّ صُورَةٍ.', sains: 'Tuliskan kategori yang betul.' },
                surih: { bm: 'Surih (trace) perkataan di bawah.', eng: 'Trace the words below.', jawi: 'سوريه ڤرکاتاءن دباوه.', arab: 'تَتَبَّعِ الكَلِمَاتِ.', sains: 'Surih (trace) perkataan di bawah.' },
                lengkapkan: { bm: 'Isikan huruf yang tertinggal.', eng: 'Fill in the missing letters.', sains: 'Isikan huruf yang tertinggal.' },
                sukukata: { bm: 'Gabungkan suku kata menjadi perkataan.' },
                tambah: { math: 'Selesaikan operasi tambah di bawah.' }, tolak: { math: 'Selesaikan operasi tolak di bawah.' }
            };
            return instructions[pattern]?.[subjectId] || 'Sila jawab soalan di bawah.';
        };

        const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
        const randItem = (arr) => arr[Math.floor(Math.random() * arr.length)];
        const createMissingLetters = (word) => {
            let letters = word.split('');
            let missingIndices = [];
            let numMissing = Math.max(1, Math.floor(letters.length / 3));
            while (missingIndices.length < numMissing) {
                let idx = Math.floor(Math.random() * letters.length);
                if (!missingIndices.includes(idx)) missingIndices.push(idx);
            }
            return letters.map((l, i) => missingIndices.includes(i) ? '_' : l);
        };

        function App() {
            const [activeSubject, setActiveSubject] = useState('bm');
            const [activeSubtopic, setActiveSubtopic] = useState('');
            const [activePattern, setActivePattern] = useState('pilih');
            const [worksheetData, setWorksheetData] = useState({ type: 'pilih', items: [] });

            const handleSubjectChange = (subjectId) => {
                let nextSubtopic = '';
                if (subjectId === 'arab') nextSubtopic = 'nombor';
                else if (subjectId === 'sains') nextSubtopic = 'hidup';
                
                const universalPats = ['pilih','bulatkan','suaikan','tulis'];
                const allowSurih = ['bm','eng','jawi','arab','sains'];
                const allowIsi = ['bm','eng','sains'];
                
                let nextPattern = activePattern;
                if (subjectId === 'math') {
                    if(!['pilih','bulatkan','suaikan','tulis','tambah','tolak'].includes(nextPattern)) nextPattern = 'pilih';
                } else if (subjectId === 'bm') {
                    if(![...universalPats, 'surih', 'lengkapkan', 'sukukata'].includes(nextPattern)) nextPattern = 'pilih';
                } else {
                    if(nextPattern === 'surih' && !allowSurih.includes(subjectId)) nextPattern = 'pilih';
                    if(nextPattern === 'lengkapkan' && !allowIsi.includes(subjectId)) nextPattern = 'pilih';
                    if(['tambah','tolak','sukukata'].includes(nextPattern)) nextPattern = 'pilih';
                }

                setActiveSubject(subjectId);
                setActiveSubtopic(nextSubtopic);
                setActivePattern(nextPattern);
            };

            const generateWorksheet = useCallback(() => {
                const isMath = activeSubject === 'math';
                const targetLang = activeSubject;
                let db = dbGeneral;
                
                if (activeSubject === 'arab') db = dbArab[activeSubtopic || 'nombor'];
                else if (activeSubject === 'sains') db = dbSains[activeSubtopic || 'hidup'];

                let newData = { type: activePattern, items: [] };
                
                // Menetapkan bilangan soalan
                let numQs = 6; 
                if (['suaikan', 'sukukata', 'tambah', 'tolak'].includes(activePattern)) numQs = 5;

                if (['pilih', 'bulatkan'].includes(activePattern)) {
                    let uniqueItems = [...new Map(db.map(item => [item.emoji, item])).values()];
                    let selected = shuffle(uniqueItems).slice(0, numQs);
                    while (selected.length < numQs) selected.push(randItem(db)); 

                    newData.items = selected.map(item => {
                        let count = isMath ? Math.floor(Math.random() * 8) + 2 : 1;
                        let correct = isMath ? count.toString() : item[targetLang];
                        let wrong = '';
                        if (isMath) {
                            wrong = (count + (Math.random() > 0.5 ? 1 : -1)).toString();
                        } else {
                            let optionsAvailable = [...new Set(db.map(i => i[targetLang]))];
                            if (activeSubject === 'sains' && optionsAvailable.length === 2) {
                                wrong = optionsAvailable.find(opt => opt !== correct) || '';
                            } else {
                                let wrongItem = randItem(db);
                                let attempts = 0;
                                while (wrongItem[targetLang] === correct && attempts < 10) { wrongItem = randItem(db); attempts++; }
                                wrong = wrongItem[targetLang] || '';
                            }
                        }
                        return { emoji: item.emoji, count, options: shuffle([correct, wrong]) };
                    });
                } 
                else if (activePattern === 'suaikan') {
                    let selectedLeft = shuffle(db).slice(0, numQs);
                    while(selectedLeft.length < numQs) selectedLeft.push(randItem(db));

                    newData.left = selectedLeft.map((item, i) => ({
                        id: i, emoji: item.emoji, count: isMath ? Math.floor(Math.random() * 8) + 2 : 1, text: item[targetLang]
                    }));
                    newData.right = shuffle(newData.left.map(l => ({
                        id: l.id, text: isMath ? l.count.toString() : l.text
                    })));
                }
                else if (['tulis', 'surih'].includes(activePattern)) {
                    let selected = shuffle(db).slice(0, numQs);
                    while (selected.length < numQs) selected.push(randItem(db));
                    newData.items = selected.map(item => ({
                        emoji: item.emoji, count: isMath ? Math.floor(Math.random() * 8) + 2 : 1, text: item[targetLang]
                    }));
                }
                else if (activePattern === 'lengkapkan') {
                    let validDb = db.filter(i => i[targetLang] && i[targetLang].length > 2);
                    if(validDb.length === 0) validDb = db;
                    let selected = shuffle(validDb).slice(0, numQs);
                    while (selected.length < numQs) selected.push(randItem(validDb));
                    newData.items = selected.map(item => ({
                        emoji: item.emoji, splitText: createMissingLetters(item[targetLang])
                    }));
                }
                else if (activePattern === 'sukukata') {
                    let dbSK = dbGeneral.filter(i => i.sk);
                    let selected = shuffle(dbSK).slice(0, numQs);
                    newData.items = selected.map(item => ({ emoji: item.emoji, sk: item.sk }));
                }
                else if (activePattern === 'tambah' || activePattern === 'tolak') {
                    let qs = [];
                    for(let i=0; i<numQs; i++) {
                        let total = Math.floor(Math.random() * 6) + 4;
                        let sub = Math.floor(Math.random() * (total - 1)) + 1;
                        qs.push({ 
                            emoji: randItem(dbGeneral).emoji, 
                            c1: activePattern === 'tambah' ? total-sub : total, 
                            c2: sub, 
                            op: activePattern === 'tambah' ? '+' : '-' 
                        });
                    }
                    newData.items = qs;
                }

                setWorksheetData(newData);
            }, [activeSubject, activeSubtopic, activePattern]);

            useEffect(() => { generateWorksheet(); }, [generateWorksheet]);

            const currentSubject = subjects.find(s => s.id === activeSubject);
            const isRTL = activeSubject === 'jawi' || activeSubject === 'arab';

            const availablePatterns = [
                {id:'pilih', name:'Tandakan ✓', all:true}, {id:'bulatkan', name:'Bulatkan Jawapan', all:true},
                {id:'suaikan', name:'Suaikan Garis', all:true}, {id:'tulis', name:'Tulis Jawapan', all:true},
                {id:'surih', name:'Surih (Trace)', allow:['bm','eng','jawi','arab','sains']},
                {id:'lengkapkan', name:'Isi Huruf', allow:['bm','eng','sains']},
                {id:'sukukata', name:'Suku Kata', only:['bm']},
                {id:'tambah', name:'Operasi Tambah (+)', only:['math']}, {id:'tolak', name:'Operasi Tolak (-)', only:['math']}
            ];

            return (
                <div className="w-full flex flex-col items-center">
                    
                    {/* --- PANEL KAWALAN (Disediakan No Print) --- */}
                    <div className="no-print bg-white shadow-xl p-6 mb-8 w-full max-w-5xl rounded-b-2xl border-t-8 border-emerald-500 z-20">
                        <h1 className="text-3xl font-extrabold text-center mb-6 text-emerald-600">
                            ✅ Penjana Lembaran Pra V6 (QA Final)
                        </h1>
                        
                        <div className="mb-5">
                            <p className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 text-center">1. Pilih Subjek</p>
                            <div className="flex flex-wrap justify-center gap-2">
                                {subjects.map((sub) => (
                                    <button key={sub.id} onClick={() => handleSubjectChange(sub.id)}
                                        className={`px-5 py-2.5 rounded-xl font-bold text-sm transition-all ${
                                            activeSubject === sub.id ? 'bg-emerald-500 text-white shadow-md transform scale-105' : 'bg-gray-100 hover:bg-gray-200 text-gray-600'
                                        }`}>
                                        {sub.name}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {currentSubject?.subtopics && (
                            <div className="mb-5 bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                                <p className="text-xs font-bold text-emerald-600 uppercase tracking-widest mb-3 text-center">
                                    📖 Topik Khusus {currentSubject.name}
                                </p>
                                <div className="flex flex-wrap justify-center gap-2">
                                    {currentSubject.subtopics.map((st) => (
                                        <button key={st} onClick={() => setActiveSubtopic(st)}
                                            className={`px-4 py-1.5 rounded-full font-semibold text-sm transition-all ${
                                                activeSubtopic === st ? 'bg-amber-400 text-amber-900 shadow-md' : 'bg-white border border-gray-200 text-gray-600 hover:bg-gray-50'
                                            }`}>
                                            {subtopicLabels[st]}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="mb-6 border-t pt-5">
                            <p className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2 text-center">2. Pilih Corak Soalan</p>
                            <div className="flex flex-wrap justify-center gap-3">
                                {availablePatterns.filter(p => p.all || (p.allow && p.allow.includes(activeSubject)) || (p.only && p.only.includes(activeSubject))).map(p => (
                                    <button key={p.id} onClick={() => setActivePattern(p.id)} 
                                    className={`px-4 py-2 rounded-full border-2 font-bold ${activePattern === p.id ? 'border-emerald-500 bg-emerald-50 text-emerald-700 shadow-inner' : 'border-gray-200 text-gray-500 hover:bg-gray-50'}`}>
                                        {p.name}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="flex justify-center gap-4 border-t pt-6 bg-gray-50 -mx-6 -mb-6 p-6 rounded-b-xl">
                            <button onClick={generateWorksheet} className="flex items-center gap-2 px-6 py-3 bg-teal-500 hover:bg-teal-600 text-white font-bold rounded-xl shadow-md transition-transform hover:scale-105">
                                🔄 Jana Semula
                            </button>
                            <button onClick={() => window.print()} className="flex items-center gap-2 px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-transform hover:scale-105">
                                🖨️ Cetak (Saiz A4)
                            </button>
                        </div>
                    </div>

                    {/* --- KERTAS A4 UNTUK DICETAK --- */}
                    <div className="a4-page bg-white shadow-2xl relative flex flex-col z-10 max-w-[210mm] w-[210mm] min-h-[297mm] p-[15mm] border border-gray-200 rounded-md">
                        
                        {/* Hiasan Bucu */}
                        <div className="absolute top-0 left-0 w-full h-4 bg-gradient-to-r from-emerald-400 via-amber-300 to-sky-400 opacity-90 z-0"></div>
                        <div className="absolute top-4 left-4 text-3xl opacity-20 z-0">✏️</div>
                        <div className="absolute top-10 right-10 text-3xl opacity-20 z-0">🎨</div>

                        {/* Bahagian Atas (Header & Tajuk) */}
                        <div className="relative z-10">
                            <div className="flex justify-between items-end border-b-2 border-dashed border-gray-400 pb-2 mb-6 text-lg font-bold mt-2">
                                <div className="flex gap-2 w-7/12 items-end">
                                    <span className="text-gray-800">Nama:</span>
                                    <div className="border-b-2 border-gray-700 flex-1"></div>
                                </div>
                                <div className="flex gap-2 w-4/12 items-end">
                                    <span className="text-gray-800">Tarikh:</span>
                                    <div className="border-b-2 border-gray-700 flex-1"></div>
                                </div>
                            </div>

                            <div className="text-center mb-8 bg-emerald-50 py-3 rounded-2xl border-2 border-emerald-100">
                                <h2 className="text-4xl font-extrabold tracking-wide mb-2 text-emerald-700 uppercase">
                                    {currentSubject.name} {activeSubtopic ? `- ${subtopicLabels[activeSubtopic]}` : ''}
                                </h2>
                                <p className={`text-xl font-bold text-gray-700 ${isRTL ? 'font-arabic text-2xl' : ''}`} dir={isRTL ? "rtl" : "ltr"}>
                                    {getInstruction(activeSubject, activePattern)}
                                </p>
                            </div>
                        </div>

                        {/* --- KAWASAN SOALAN UTAMA --- */}
                        <div className="w-full relative z-10 flex-1 flex flex-col pb-4">
                            
                            {/* 1. TANDAKAN & BULATKAN (GRID) */}
                            {['pilih', 'bulatkan'].includes(worksheetData.type) && (
                                <div className="grid grid-cols-2 gap-x-8 gap-y-10 w-full">
                                    {worksheetData.items.map((q, idx) => (
                                        <div key={idx} className="flex flex-col border-4 border-gray-100 rounded-2xl overflow-hidden bg-gray-50 h-[170px] shadow-sm">
                                            {/* Tinggi kotak dihadkan (fixed height) supaya tidak meregang melebih kertas */}
                                            <div className="flex-1 bg-white flex flex-wrap justify-center items-center gap-1 p-2 border-b-4 border-gray-100">
                                                {Array.from({ length: q.count }).map((_, i) => (
                                                    <span key={i} className={q.count > 4 ? "text-4xl" : "text-5xl"} style={{ filter: 'drop-shadow(2px 2px 4px rgba(0,0,0,0.1))' }}>{q.emoji}</span>
                                                ))}
                                            </div>
                                            <div className={`flex w-full justify-around items-center h-[60px] ${isRTL ? 'font-arabic text-3xl' : 'text-2xl'} ${activeSubject === 'sains' ? 'text-lg font-bold' : 'font-extrabold'}`} dir={isRTL ? "rtl" : "ltr"}>
                                                {q.options.map((opt, i) => (
                                                    <div key={i} className={`flex items-center gap-2 h-10 ${worksheetData.type === 'bulatkan' ? 'border-2 border-dashed border-gray-400 rounded-full px-4 bg-white' : ''}`}>
                                                        {worksheetData.type === 'pilih' && <div className="w-6 h-6 border-2 border-gray-400 rounded bg-white"></div>}
                                                        <span>{opt}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {/* 2. SUAIKAN (FLEX COL GAP) */}
                            {worksheetData.type === 'suaikan' && (
                                <div className="flex justify-between w-full px-8">
                                    {/* Spacing menggunakan gap-10 antara kotak */}
                                    <div className="flex flex-col gap-10 w-[45%]">
                                        {worksheetData.left?.map((item, idx) => (
                                            <div key={idx} className="flex items-center gap-4">
                                                <div className="flex-1 h-[90px] border-4 border-emerald-100 rounded-2xl flex flex-wrap justify-center items-center p-2 bg-white shadow-sm">
                                                    {Array.from({ length: item.count }).map((_, i) => <span key={i} className={item.count > 4 ? "text-3xl" : "text-4xl"}>{item.emoji}</span>)}
                                                </div>
                                                <div className="w-4 h-4 rounded-full bg-emerald-400 shadow-md"></div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex flex-col gap-10 w-[45%] items-end">
                                        {worksheetData.right?.map((item, idx) => (
                                            <div key={idx} className="flex items-center gap-4 w-full justify-end">
                                                <div className="w-4 h-4 rounded-full bg-amber-400 shadow-md"></div>
                                                <div className={`flex-1 h-[90px] border-4 border-amber-100 rounded-2xl flex justify-center items-center text-2xl font-extrabold text-gray-800 p-4 text-center bg-white shadow-sm ${isRTL ? 'font-arabic text-3xl' : ''}`} dir={isRTL ? "rtl" : "ltr"}>{item.text}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* 3. TULIS & SURIH (GRID GAP) */}
                            {['tulis', 'surih'].includes(worksheetData.type) && (
                                <div className="grid grid-cols-2 gap-x-10 gap-y-12 w-full">
                                    {worksheetData.items.map((item, idx) => (
                                        <div key={idx} className="flex flex-col items-center w-full border-b-2 border-dashed border-gray-300 pb-2 h-[150px]">
                                            <div className="w-full flex-1 border-4 border-gray-100 rounded-2xl flex flex-wrap justify-center items-center p-2 bg-gray-50 mb-3">
                                                {Array.from({ length: item.count }).map((_, i) => <span key={i} className={item.count > 4 ? "text-3xl" : "text-4xl"}>{item.emoji}</span>)}
                                            </div>
                                            {worksheetData.type === 'tulis' ? (
                                                activeSubject === 'math' ? (
                                                    <div className="w-20 h-20 border-4 border-gray-300 rounded-2xl bg-white mb-1 shadow-inner"></div>
                                                ) : (
                                                    <div className="w-full h-12 border-b-4 border-gray-400 relative mb-1">
                                                        <div className="absolute bottom-4 w-full border-b border-dashed border-gray-300"></div>
                                                    </div>
                                                )
                                            ) : (
                                                <div className={`w-full text-center text-4xl font-surih font-bold mb-1 ${isRTL ? 'font-arabic' : ''}`} dir={isRTL ? "rtl" : "ltr"}>{item.text}</div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            )}

                            {/* 4. LENGKAPKAH HURUF (GRID GAP) */}
                            {worksheetData.type === 'lengkapkan' && (
                                <div className="grid grid-cols-2 gap-x-8 gap-y-12 w-full">
                                    {worksheetData.items.map((q, idx) => (
                                        <div key={idx} className="flex flex-col items-center justify-center border-4 border-gray-100 p-4 rounded-3xl bg-white h-[140px] shadow-sm">
                                            <span className="text-5xl mb-4" style={{ filter: 'drop-shadow(0px 4px 6px rgba(0,0,0,0.15))' }}>{q.emoji}</span>
                                            <div className="flex gap-3">
                                                {q.splitText.map((char, k) => (
                                                    char === '_' ? 
                                                    <div key={k} className="w-10 h-12 border-b-4 border-gray-400"></div> : 
                                                    <div key={k} className="w-10 h-12 flex justify-center items-end font-extrabold text-4xl uppercase text-gray-700">{char}</div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {/* 5. SUKU KATA (FLEX COL GAP) */}
                            {worksheetData.type === 'sukukata' && (
                                <div className="flex flex-col gap-10 w-full px-2">
                                    {worksheetData.items.map((q, idx) => (
                                        <div key={idx} className="flex items-center bg-blue-50 h-[100px] px-6 rounded-3xl border-2 border-blue-100 shadow-sm">
                                            <span className="text-5xl mr-6 bg-white p-3 rounded-2xl border border-gray-100 shadow-sm">{q.emoji}</span>
                                            <div className="flex items-center gap-3 font-extrabold text-2xl text-gray-700 uppercase">
                                                {q.sk.map((s, k) => (
                                                    <React.Fragment key={k}>
                                                        <div className="border-4 border-dashed border-blue-300 px-5 py-2 bg-white rounded-xl shadow-inner tracking-widest">{s}</div>
                                                        {k < q.sk.length - 1 && <span className="text-blue-400">+</span>}
                                                    </React.Fragment>
                                                ))}
                                                <span className="text-gray-400">=</span>
                                                <div className="border-b-4 border-gray-500 w-40 h-12 bg-white rounded-md"></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {/* 6. TAMBAH & TOLAK (FLEX COL GAP) */}
                            {['tambah', 'tolak'].includes(worksheetData.type) && (
                                <div className="flex flex-col gap-8 w-full px-2">
                                    {worksheetData.items.map((item, idx) => (
                                        <div key={idx} className="flex items-center justify-between w-full h-[110px] bg-gray-50 rounded-[2rem] p-4 border-2 border-white shadow-sm">
                                            <div className="flex flex-wrap justify-center items-center gap-1 w-32 bg-white h-full rounded-2xl border-2 border-gray-200 shadow-sm">
                                                {Array.from({ length: item.c1 }).map((_, i) => <span key={`a${i}`} className="text-3xl">{item.emoji}</span>)}
                                            </div>
                                            <div className={`text-6xl font-black ${worksheetData.type === 'tambah' ? 'text-emerald-500' : 'text-rose-500'}`}>
                                                {item.op}
                                            </div>
                                            <div className="flex flex-wrap justify-center items-center gap-1 w-32 bg-white h-full rounded-2xl border-2 border-gray-200 shadow-sm">
                                                {Array.from({ length: item.c2 }).map((_, i) => <span key={`b${i}`} className="text-3xl">{item.emoji}</span>)}
                                            </div>
                                            <div className="text-5xl font-black text-gray-400">=</div>
                                            <div className="w-24 h-full border-4 border-gray-300 bg-white rounded-2xl shadow-inner"></div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* Footer Print */}
                        <div className="relative z-10 text-center text-gray-400 font-bold text-sm tracking-widest mt-auto border-t border-gray-200 pt-3 pb-1">
                            🌟 SYABAS! TERUSKAN USAHA! 🌟
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
